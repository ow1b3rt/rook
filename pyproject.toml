[project]
name = "rook-research"
version = "0.1.0"
description = "Local-first market evidence collection. Find the signal."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "trafilatura>=2,<3", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "typer>=0.15,<1", "rich>=13,<15"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
youtube = ["yt-dlp"]
instagram = ["instaloader"]
tiktok = ["TikTokApi"]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
rook = "rook.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rook"]

[tool.ruff]
line-length = 100
