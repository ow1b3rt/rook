services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rook
      POSTGRES_USER: rook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rook_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rook -d rook"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
